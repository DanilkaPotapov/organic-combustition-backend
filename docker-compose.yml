services:
  postgres:
    image: postgres:17-alpine
    container_name: potapov-organic-compounds-postgres
    environment:
      POSTGRES_USER: organic_compounds_user
      POSTGRES_PASSWORD: organic_compounds_pass
      POSTGRES_DB: organic_compounds_lab2
    ports:
      - "5433:5432"
    volumes:
      - organic_compounds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organic_compounds_user -d organic_compounds_lab2"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: potapov-organic-compounds-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  organic-compounds-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: potapov-organic-compounds-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - organic_compounds_minio_data:/data

  organic-compounds-media-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - organic-compounds-minio
    volumes:
      - ./media:/media:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set organic http://organic-compounds-minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing organic/organic-compounds-media;
      mc anonymous set public organic/organic-compounds-media;
      mc cp --recursive /media/ organic/organic-compounds-media/;
      echo 'MinIO bucket organic-compounds-media is ready';
      "

volumes:
  organic_compounds_postgres_data:
  organic_compounds_minio_data:
