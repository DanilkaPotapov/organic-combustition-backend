name: potapov-lab4
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: organic_compounds_user
      POSTGRES_PASSWORD: organic_compounds_pass
      POSTGRES_DB: organic_compounds_lab4
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organic_compounds_user -d organic_compounds_lab4"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    volumes:
      - ./media:/media:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/organic-compounds &&
      mc anonymous set download local/organic-compounds &&
      mc cp --recursive /media/ local/organic-compounds/;
      "
  adminer:
    image: adminer:4.8.1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
volumes:
  postgres_data:
  redis_data:
  minio_data:
