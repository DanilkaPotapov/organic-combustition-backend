services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: organic-analysis-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    volumes:
      - ./media:/media:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/organic-media;
      mc anonymous set download local/organic-media;
      mc cp --recursive /media/ local/organic-media/;
      echo 'MinIO bucket organic-media is ready';
      "

volumes:
  minio_data:
